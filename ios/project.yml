name: TrailMind
options:
  bundleIdPrefix: com.trailmind
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  TrailMind:
    type: application
    platform: iOS
    sources: [TrailMind]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trailmind.ios.beta
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: TrailMind Preview
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: Show your position, direction and location to share while TrailMind is open.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
  TrailMindTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TrailMindTests]
    dependencies:
      - target: TrailMind
schemes:
  TrailMind:
    build:
      targets:
        TrailMind: all
    test:
      targets:
        - TrailMindTests

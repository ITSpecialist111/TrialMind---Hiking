name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Unit tests, debug builds and lint
        run: >-
          ./gradlew --console=plain
          :core:test :app:testDebugUnitTest
          :app:assembleDebug :wear:assembleDebug
          :app:lintDebug :wear:lintDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: trailmind-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
            wear/build/reports/
          if-no-files-found: ignore
